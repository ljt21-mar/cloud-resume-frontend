name: Deploy Cloud Resume Frontend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          TOKEN="$TOKEN" python3 - <<'PY'
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "workflow",
              "event_name",
              "environment"
          ]:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403776649434:role/GitHubActions-CloudResume-Frontend
          aws-region: us-east-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://ljt-resume-challenge-2026 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1TLSFUMR62VY4 \
            --paths "/*"
